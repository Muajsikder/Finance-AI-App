<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>FinanceAI - Login</title>

    <link rel="stylesheet" href="style.css">

    <script src="login.js" defer></script>

</head>


<body>


    <!-- Welcome Section -->
    <div class="welcome">

        <h1>FinanceAI</h1>

        <h2>Welcome Back!</h2>

        <p>
            Sign in to access your personal finance dashboard and AI assistant.
        </p>

    </div>



    <!-- Login Form -->
    <form id="loginForm">


        <!-- Email -->
        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>


        <br><br>


        <!-- Password -->
        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>


        <br><br>


        <!-- Submit Button -->
        <button type="submit">
            Sign In
        </button>


    </form>



    <!-- Signup Link -->
    <div class="signup">

        <p>
            Don't have an account?
        </p>

        <a href="signup.html">
            Create an Account
        </a>

    </div>



    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Muaj Sikder | FinanceAI
        </p>

    </footer>



</body>

</html>
