<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>FinanceAI - Sign Up</title>

    <link rel="stylesheet" href="style.css">

    <script src="signup.js" defer></script>

</head>


<body>


    <div class="welcome">

        <h1>FinanceAI</h1>

        <h2>Create an Account</h2>

        <p>
            Sign up to start managing your finances with AI.
        </p>

    </div>



    <form id="signupForm">


        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required>


        <br><br>


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>


        <br><br>


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required>


        <br><br>


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            required>


        <br><br>


        <button type="submit">
            Sign Up
        </button>


    </form>



    <div class="signup">

        <p>
            Already have an account?
        </p>

        <a href="index.html">
            Sign In
        </a>

    </div>



    <footer>

        <p>
            &copy; 2026 Muaj Sikder | FinanceAI
        </p>

    </footer>


</body>

</html>
